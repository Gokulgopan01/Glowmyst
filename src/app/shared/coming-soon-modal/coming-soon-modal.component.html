<div class="cs-overlay" [class.is-closing]="closing()" *ngIf="comingSoonService.isOpen()" (click)="close()"
  aria-modal="true" role="dialog" aria-labelledby="cs-title-id">

  <div class="cs-card" (click)="$event.stopPropagation()">

    <!-- Rotating gold hairline border -->
    <span class="cs-border" aria-hidden="true"></span>

    <!-- Ambient light + floating gold dust -->
    <div class="cs-aura" aria-hidden="true"></div>
    <div class="cs-dust" aria-hidden="true">
      <span *ngFor="let d of dust" class="cs-dust-dot" [style.--i]="d"></span>
    </div>

    <!-- Close -->
    <button class="cs-close-btn" (click)="close()" aria-label="Close" type="button">
      <lucide-icon [img]="XIcon" size="14"></lucide-icon>
    </button>

    <!-- Visual -->
    <div class="cs-visual">
      <img src="assets/saree/saree_lady_cutout_2x.png" alt="Glowmyst Saree Collection" class="cs-lady-img" />
      <div class="cs-visual-fade"></div>
      <span class="cs-sheen" aria-hidden="true"></span>
    </div>

    <!-- Content -->
    <div class="cs-content">

      <svg class="cs-lotus" viewBox="0 0 70 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path pathLength="1" d="M35 3 C30 15 28 29 35 43 C42 29 40 15 35 3 Z" />
        <path pathLength="1" d="M35 43 C23 37 15 23 23 11 C30 20 33 32 35 43 Z" />
        <path pathLength="1" d="M35 43 C47 37 55 23 47 11 C40 20 37 32 35 43 Z" />
        <path pathLength="1" d="M33 44 C18 42 7 32 10 21 C18 26 27 36 33 44 Z" />
        <path pathLength="1" d="M37 44 C52 42 63 32 60 21 C52 26 43 36 37 44 Z" />
        <path pathLength="1" d="M26 45 C30 48 40 48 44 45" />
      </svg>

      <div class="cs-brand">
        <span class="cs-line"></span>
        <span class="cs-brand-text">GLOWMYST</span>
        <span class="cs-line"></span>
      </div>

      <h2 class="cs-title" id="cs-title-id">
        <span class="cs-title-text">Coming Soon</span>
      </h2>

      <p class="cs-subtitle">{{ comingSoonService.details().title || 'Saree Collection' }}</p>

      <p class="cs-desc">{{ comingSoonService.details().message }}</p>

      <button class="cs-cta" (click)="notifyViaWhatsApp()" type="button">
        <svg class="cs-wa-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.63C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.03 14.69 2 12.04 2ZM12.05 3.67C14.25 3.67 16.31 4.53 17.87 6.09C19.42 7.65 20.28 9.72 20.28 11.92C20.28 16.46 16.59 20.15 12.04 20.15C10.56 20.15 9.11 19.76 7.85 19.01L7.55 18.83L4.43 19.65L5.26 16.61L5.06 16.29C4.24 14.99 3.81 13.47 3.81 11.91C3.81 7.37 7.5 3.67 12.05 3.67ZM8.97 7.38C8.76 7.38 8.42 7.46 8.13 7.77C7.84 8.08 7.03 8.84 7.03 10.38C7.03 11.92 8.15 13.4 8.31 13.61C8.47 13.82 10.47 16.9 13.56 18.23C14.3 18.55 14.87 18.74 15.32 18.88C16.07 19.12 16.75 19.08 17.29 19C17.89 18.91 19.13 18.25 19.39 17.52C19.65 16.79 19.65 16.16 19.57 16.03C19.49 15.9 19.28 15.82 18.97 15.66C18.66 15.5 17.14 14.75 16.86 14.65C16.58 14.55 16.38 14.5 16.18 14.81C15.98 15.12 15.4 15.82 15.22 16.03C15.04 16.24 14.86 16.26 14.55 16.11C14.24 15.95 13.25 15.63 12.08 14.58C11.17 13.77 10.56 12.76 10.4 12.49C10.24 12.22 10.38 12.07 10.54 11.92C10.68 11.78 10.85 11.55 11.01 11.37C11.17 11.19 11.22 11.06 11.32 10.85C11.42 10.65 11.37 10.47 11.29 10.31C11.21 10.16 10.6 8.67 10.35 8.05C10.1 7.45 9.85 7.53 9.66 7.52C9.48 7.51 9.27 7.51 9.07 7.51L8.97 7.38Z" />
        </svg>
        <span class="cs-cta-text">Notify me on WhatsApp</span>
        <lucide-icon class="cs-cta-arrow" [img]="ArrowRightIcon" size="14"></lucide-icon>
        <span class="cs-cta-shine" aria-hidden="true"></span>
      </button>

      <button class="cs-continue" (click)="close()" type="button">Continue exploring</button>
    </div>
  </div>
</div>
