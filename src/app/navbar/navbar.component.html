<div class="top-banner" [class.scrolled]="isScrolled">
  <div class="banner-text">
    ✨ FREE INSURED SHIPPING &nbsp; &bull; &nbsp; LIFETIME WARRANTY &nbsp; &bull; &nbsp; 15 DAYS EASY RETURNS
  </div>
</div>
<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="navbar-container">
    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" (click)="toggleMobileMenu()" aria-label="Open menu">
      <lucide-icon [img]="MenuIcon"></lucide-icon>
    </button>

    <!-- Logo -->
    <div class="logo-container">
      <img src="assets/Glowmyst_logo.png" alt="Glowmyst Logo" class="logo-img">
    </div>

    <!-- Navigation Links -->
    <div class="nav-menu-wrapper" [class.mobile-open]="isMobileMenuOpen" data-lenis-prevent>
      
      <!-- Mobile Header -->
      <div class="mobile-menu-header">
        <div class="mobile-logo-container">
          <img src="assets/Glowmyst_logo.png" alt="Glowmyst Logo" class="mobile-logo-img">
        </div>
        <button class="close-menu-btn" (click)="toggleMobileMenu()" aria-label="Close menu">
          <lucide-icon [img]="XIcon"></lucide-icon>
        </button>
      </div>

      <ul class="nav-menu">
        <li class="nav-item">
          <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link" (click)="closeMobileMenu()">
            <div class="mobile-icon-wrapper"><lucide-icon [img]="HomeIcon" class="mobile-nav-icon"></lucide-icon></div>
            <span class="nav-text-span">Home</span>
            <lucide-icon [img]="ChevronRightIcon" class="mobile-nav-arrow"></lucide-icon>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/jewellery" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">
            <div class="mobile-icon-wrapper"><lucide-icon [img]="GemIcon" class="mobile-nav-icon"></lucide-icon></div>
            <span class="nav-text-span">Jewellery</span>
            <lucide-icon [img]="ChevronRightIcon" class="mobile-nav-arrow"></lucide-icon>
          </a>
        </li>
        <li class="nav-item">
          <a href="javascript:void(0)" class="nav-link" (click)="onSareeClick($event)">
            <div class="mobile-icon-wrapper"><lucide-icon [img]="SparklesIcon" class="mobile-nav-icon"></lucide-icon></div>
            <span class="nav-text-span">Sarees</span>
            <lucide-icon [img]="ChevronRightIcon" class="mobile-nav-arrow"></lucide-icon>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/about-us" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">
            <div class="mobile-icon-wrapper"><lucide-icon [img]="UserIcon" class="mobile-nav-icon"></lucide-icon></div>
            <span class="nav-text-span">About Us</span>
            <lucide-icon [img]="ChevronRightIcon" class="mobile-nav-arrow"></lucide-icon>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/contact-us" routerLinkActive="active" class="nav-link" (click)="closeMobileMenu()">
            <div class="mobile-icon-wrapper"><lucide-icon [img]="MailIcon" class="mobile-nav-icon"></lucide-icon></div>
            <span class="nav-text-span">Contact Us</span>
            <lucide-icon [img]="ChevronRightIcon" class="mobile-nav-arrow"></lucide-icon>
          </a>
        </li>
      </ul>

      <!-- Chat With Us Button -->
      <button class="mobile-chat-btn" (click)="whatsappService.openGeneralChat()" type="button" aria-label="Chat with us on WhatsApp">
        <lucide-icon [img]="HeadphonesIcon" class="chat-icon"></lucide-icon>
        <div class="chat-text">
          <span class="chat-title">Chat With Us</span>
          <span class="chat-subtitle">We're here to help!</span>
        </div>
        <lucide-icon [img]="ChevronRightIcon" class="chat-arrow"></lucide-icon>
      </button>

      <!-- Follow Us Section -->
      <div class="mobile-follow-us">
        <span class="follow-label">FOLLOW US</span>
        <div class="follow-line"></div>
        <div class="social-icons">
          <a href="#" class="social-btn"><lucide-icon [img]="InstagramIcon"></lucide-icon></a>
          <a href="#" class="social-btn"><lucide-icon [img]="FacebookIcon"></lucide-icon></a>
          <a href="#" class="social-btn"><lucide-icon [img]="TwitterIcon"></lucide-icon></a>
        </div>
      </div>
    </div>
    <!-- Search Box -->
    <div class="search-container">
      <input type="text" class="search-box" placeholder="Search for jewels or sarees...">
      <lucide-icon [img]="SearchIcon" class="search-icon"></lucide-icon>
    </div>
  </div>

  <!-- Mobile Menu Overlay — always rendered so the closing fade can play (see .active class in SCSS) -->
  <div class="mobile-overlay" [class.active]="isMobileMenuOpen" (click)="toggleMobileMenu()"></div>
</nav>
